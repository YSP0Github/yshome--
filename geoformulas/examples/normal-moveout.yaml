      note: 反射几何与双程路径的定义
    - id: bodywave-traveltime-constant-velocity
      note: 常速介质走时 = 距离 / 速度
  downstream:
    - id: velocity-analysis-constant-velocity-scan
      note: 由 NMO 曲线反演 v_rms
    - id: nmo-correction-stretch-mute
      note: 动校正拉伸与切除
    - id: cmp-stacking
      note: CMP 道集叠加
  seealso:
    - id: dmo-dip-moveout
      note: 倾斜界面时的修正
    - id: nonhyperbolic-moveout

refs:
  - type: book
    text: Yilmaz, Seismic Data Analysis, Vol.1, Ch.3 —— NMO 与速度分析
    url: https://wiki.seg.org/wiki/Normal_moveout
  - type: book
    text: Sheriff & Geldart, Exploration Seismology, 2nd ed., §4.3
  - type: web
    text: SEG Wiki — Normal moveout
    url: https://wiki.seg.org/wiki/Normal_moveout

difficulty:
  prerequisites: [勾股定理, 双程走时概念]
  level: 入门
